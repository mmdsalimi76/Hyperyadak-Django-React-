services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    volumes:
      - ./backend/src:/app
      - backend-static:/staticfiles
    ports:
      - "8000:8000"
      - "8089:8089"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - db
      - redis
    restart: on-failure
    working_dir: /app
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-celery-worker
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend/src:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - redis
      - db
    restart: on-failure
    working_dir: /app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm run dev -- --host 0.0.0.0 "
    depends_on:
      - backend
    stdin_open: true
    tty: true

  db:
    image: docker.iranserver.com/postgres:15-alpine
    container_name: todo-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_password123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.iranserver.com/redis:alpine
    container_name: todo-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  backend-static:
