server {
    listen 80;
    server_name hyperyadak63.ir www.hyperyadak63.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hyperyadak63.ir www.hyperyadak63.ir;

    ssl_certificate /etc/letsencrypt/live/hyperyadak63.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperyadak63.ir/privkey.pem;
    

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Django collected static files (served locally from volume)
    location ^~ /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # API and admin reverse proxy
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback – any other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}